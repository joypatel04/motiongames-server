<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Floor Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { font-size: 22px; margin-bottom: 12px; letter-spacing: 0.02em; }
    #status {
      padding: 6px 14px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 500;
    }
    .connected { background: #064e3b; color: #6ee7b7; }
    .disconnected { background: #7f1d1d; color: #fca5a5; }
    .waiting { background: #78350f; color: #fcd34d; }
    #info-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
      font-size: 15px;
    }
    #info-bar span { opacity: 0.7; }
    #info-bar strong { opacity: 1; }
    #grid-container {
      display: inline-grid;
      gap: 2px;
      padding: 8px;
      background: #111;
      border-radius: 8px;
      user-select: none;
    }
    .tile {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.05s, transform 0.05s;
      position: relative;
    }
    .tile:hover { opacity: 0.85; }
    .tile:active { transform: scale(0.92); }
    .tile .index {
      position: absolute;
      bottom: 1px;
      right: 3px;
      font-size: 8px;
      color: rgba(255, 255, 255, 0.3);
      pointer-events: none;
    }
    #scores {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .score-card {
      background: #1a1a1a;
      padding: 10px 18px;
      border-radius: 8px;
      text-align: center;
      min-width: 100px;
    }
    .score-card .name { font-size: 12px; opacity: 0.7; }
    .score-card .value { font-size: 26px; font-weight: 700; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>Arena Floor Simulator</h1>
  <div id="status" class="disconnected">Disconnected</div>
  <div id="info-bar">
    <div>Game: <strong id="game-name">—</strong></div>
    <div>Time: <strong id="timer">0:00</strong></div>
  </div>
  <div id="grid-container"></div>
  <div id="scores"></div>

  <script>
    const DEFAULT_ROWS = 16;
    const DEFAULT_COLS = 12;
    const DEFAULT_COLOR = '#1f2937';

    let ws = null;
    let tiles = [];
    let gridCols = DEFAULT_COLS;
    let reconnectTimer = null;

    function initGrid(rows, cols) {
      gridCols = cols;
      const container = document.getElementById('grid-container');
      container.style.gridTemplateColumns = `repeat(${cols}, 40px)`;
      container.innerHTML = '';
      tiles = [];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const idx = r * cols + c;
          const div = document.createElement('div');
          div.className = 'tile';
          div.style.backgroundColor = DEFAULT_COLOR;
          div.innerHTML = `<span class="index">${idx}</span>`;
          div.addEventListener('mousedown', () => sendSensor(idx, true));
          div.addEventListener('mouseup', () => sendSensor(idx, false));
          div.addEventListener('mouseleave', (event) => {
            if (event.buttons !== 0) sendSensor(idx, false);
          });
          container.appendChild(div);
          tiles[idx] = div;
        }
      }
    }

    function sendSensor(index, pressed) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'sensor', tileIndex: index, pressed }));
      }
    }

    function setTile(index, r, g, b) {
      const el = tiles[index];
      if (el) el.style.backgroundColor = `rgb(${r},${g},${b})`;
    }

    function formatTime(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function setStatus(text, cls) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = cls;
    }

    function updateScores(scores) {
      const el = document.getElementById('scores');
      el.innerHTML = scores
        .map(
          (s) =>
            `<div class="score-card"><div class="name">${s.name}</div><div class="value">${s.score}</div></div>`,
        )
        .join('');
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${protocol}//${location.host}/ws`;
      setStatus('Connecting…', 'waiting');
      ws = new WebSocket(url);

      ws.onopen = () => {
        setStatus('Connected', 'connected');
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
      };

      ws.onclose = () => {
        setStatus('Disconnected — reconnecting…', 'disconnected');
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        try { ws.close(); } catch (_) { /* ignore */ }
      };

      ws.onmessage = (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch (_) {
          return;
        }

        if (msg.type === 'tile_update' && Array.isArray(msg.tiles)) {
          for (const t of msg.tiles) {
            const i = t.i !== undefined ? t.i : t.index;
            setTile(i, t.r, t.g, t.b);
          }
          if (typeof msg.remaining === 'number') {
            document.getElementById('timer').textContent = formatTime(msg.remaining);
          }
        } else if (msg.type === 'game_start') {
          document.getElementById('game-name').textContent = msg.gameId;
          if (msg.grid) initGrid(msg.grid.rows, msg.grid.cols);
        } else if (msg.type === 'game_end' || msg.type === 'game_ended') {
          document.getElementById('game-name').textContent = '— Game Over —';
          updateScores(msg.scores || []);
        } else if (msg.type === 'score_update') {
          // No-op for now; full scores arrive at game_end.
        }
      };
    }

    initGrid(DEFAULT_ROWS, DEFAULT_COLS);
    connect();
  </script>
</body>
</html>
